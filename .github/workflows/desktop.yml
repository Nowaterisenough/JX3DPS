name: Desktop CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Determine desktop version
        id: version
        shell: cmake -P {0}
        env:
          TZ: Asia/Shanghai
        run: |
          execute_process(COMMAND git log -1 --format=%ct OUTPUT_VARIABLE epoch
                          OUTPUT_STRIP_TRAILING_WHITESPACE COMMAND_ERROR_IS_FATAL ANY)
          set(ENV{SOURCE_DATE_EPOCH} "${epoch}")
          include(cmake/Version.cmake)
          version()
          # Keep the project's major.minor.date and use a run number stable across retries.
          string(REGEX REPLACE "[.][0-9]+$" ".$ENV{GITHUB_RUN_NUMBER}" tag "${PROJECT_VERSION}")
          if("$ENV{GITHUB_REF_TYPE}" STREQUAL "tag")
            set(tag "$ENV{GITHUB_REF_NAME}")
          endif()
          file(APPEND "$ENV{GITHUB_OUTPUT}" "tag=${tag}\n")
  build:
    needs: version
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows GCC
            id: windows-x86_64-gcc
            runner: windows-2025
            cc: gcc
            cxx: g++
          - name: Windows MSVC
            id: windows-x86_64-msvc
            runner: windows-2025-vs2026
            cc: cl
            cxx: cl
            qt_arch: win64_msvc2022_64
          - name: Windows Clang
            id: windows-x86_64-clang
            runner: windows-2025-vs2026
            cc: clang-cl
            cxx: clang-cl
            qt_arch: win64_msvc2022_64
          - name: Ubuntu GCC
            id: linux-x86_64-gcc
            runner: ubuntu-26.04
            cc: gcc
            cxx: g++
            qt_arch: linux_gcc_64
          - name: macOS AppleClang
            id: macos-arm64-appleclang
            runner: xcode-27
            cc: clang
            cxx: clang++
            qt_arch: clang_64
            cmake_arch: -DCMAKE_OSX_ARCHITECTURES=arm64
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Qt and GCC from the same UCRT64 repository
        if: matrix.id == 'windows-x86_64-gcc'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Select UCRT64 toolchain
        if: matrix.id == 'windows-x86_64-gcc'
        shell: msys2 {0}
        run: |
          cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
          test "$(g++ -dumpversion | cut -d. -f1)" -ge 16
          qmake6 -query QT_VERSION

      - name: Select Visual Studio x64 environment
        if: matrix.cxx == 'cl' || matrix.cxx == 'clang-cl'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio with the x64 C++ tools was not found' }
          if ($env:CXX -eq 'cl') {
            $channel = Invoke-RestMethod 'https://aka.ms/vs/18/stable/channel'
            $installed = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
            if ([version]$installed -lt [version]$channel.info.buildVersion) {
              $bootstrapper = Join-Path $env:RUNNER_TEMP 'vs_BuildTools.exe'
              Invoke-WebRequest 'https://aka.ms/vs/stable/vs_BuildTools.exe' -OutFile $bootstrapper
              $vs = Join-Path $env:RUNNER_TEMP 'vs-stable'
              $install = Start-Process $bootstrapper -ArgumentList "--quiet --wait --norestart --nocache --installPath `"$vs`" --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64" -WindowStyle Hidden -Wait -PassThru
              if ($install.ExitCode -notin 0,3010) { throw "Build Tools installation failed with $($install.ExitCode)" }
            }
          }
          $oldPath = $env:PATH -split ';'
          & (Join-Path $vs 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-Command cl.exe -ErrorAction Stop | Select-Object -ExpandProperty Source
          $env:PATH -split ';' | Where-Object { $_ -and $_ -notin $oldPath } | Add-Content -LiteralPath $env:GITHUB_PATH -Encoding utf8
          foreach ($name in 'INCLUDE','LIB','LIBPATH','VSINSTALLDIR','VCINSTALLDIR','VCToolsInstallDir','VCToolsRedistDir','WindowsSdkDir','WindowsSDKVersion','UniversalCRTSdkDir','UCRTVersion') {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$value" -Encoding utf8 }
          }
      - name: Install latest stable LLVM for the Visual Studio ABI
        if: matrix.cxx == 'clang-cl'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh api repos/llvm/llvm-project/releases/latest --jq .tag_name
          if ($LASTEXITCODE -or $tag -notmatch '^llvmorg-(\d+\.\d+\.\d+)$') { throw "Unexpected LLVM release $tag" }
          $msi = "LLVM-$($Matches[1])-win64.msi"
          gh release download $tag -R llvm/llvm-project -p $msi -D $env:RUNNER_TEMP
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dest = Join-Path $env:RUNNER_TEMP 'llvm-release'
          $install = Start-Process msiexec.exe -ArgumentList "/a `"$env:RUNNER_TEMP\$msi`" /qn TARGETDIR=`"$dest`"" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode) { throw "LLVM extraction failed with $($install.ExitCode)" }
          $driver = (Get-ChildItem -LiteralPath $dest -Recurse -File -Filter clang-cl.exe | Select-Object -First 1).FullName
          if (!$driver) { throw 'clang-cl.exe missing from LLVM package' }
          & $driver --version
          "CC=$driver", "CXX=$driver" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          Split-Path -Parent $driver | Add-Content -LiteralPath $env:GITHUB_PATH -Encoding utf8
      - name: Select latest stable GCC and install Qt system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libegl-dev libglx-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0
          brew=/home/linuxbrew/.linuxbrew/bin/brew
          "$brew" update
          "$brew" install gcc
          prefix=$("$brew" --prefix gcc)
          cxx=("$prefix"/bin/g++-[0-9]*)
          cc=("$prefix"/bin/gcc-[0-9]*)
          test -x "${cxx[0]}" && test -x "${cc[0]}"
          echo "CC=${cc[0]}" >> "$GITHUB_ENV"
          echo "CXX=${cxx[0]}" >> "$GITHUB_ENV"
      - name: Select newest stable Xcode on the runner
        if: runner.os == 'macOS'
        run: |
          xcode=$(python3 - <<'PY'
          import re
          from pathlib import Path
          apps = Path('/Applications').glob('Xcode_*.app')
          stable = [(tuple(map(int, m[1].split('.'))), p) for p in apps
                    if (m := re.fullmatch(r'Xcode_(\d+(?:\.\d+)*)\.app', p.name))]
          print(max(stable)[1])
          PY
          )
          sudo xcode-select --switch "$xcode"
          xcodebuild -version
      - name: Install Qt 6.12
        if: matrix.id != 'windows-x86_64-gcc'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: ${{ matrix.qt_arch }}
          # PyPI aqt 3.3.0 predates the Windows Qt 6.11+ repository layout.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@7e5a5c3d95cf962cfc2f36c86ffa0d2c07f1a0d4
          cache: true

      - name: Configure Release desktop
        env:
          JX3DPS_RELEASE_TAG: ${{ needs.version.outputs.tag }}
          JX3DPS_BUILD_ID: ${{ matrix.id }}
        run: |
          cmake -E make_directory build/.cmake/api/v1/query
          cmake -E touch build/.cmake/api/v1/query/toolchains-v1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJX3DPS_DESKTOP_WORKLOAD=ON "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=${{ github.workspace }}/build/bin -DCMAKE_BUILD_RPATH_USE_ORIGIN=ON ${{ matrix.cmake_arch }}
      - name: Name package from configured C++ compiler
        id: package
        shell: python {0}
        env:
          BUILD_ID: ${{ matrix.id }}
        run: |
          import json, os, re
          from pathlib import Path
          reply = Path('build/.cmake/api/v1/reply')
          index = json.loads(next(reply.glob('index-*.json')).read_text())
          toolchains = json.loads((reply / index['reply']['toolchains-v1']['jsonFile']).read_text())
          compiler = next(t['compiler'] for t in toolchains['toolchains'] if t['language'] == 'CXX')
          family = {'GNU': 'gcc', 'MSVC': 'msvc', 'Clang': 'clang', 'AppleClang': 'appleclang'}[compiler['id']]
          build = os.environ['BUILD_ID']
          version = compiler['version']
          if not build.endswith('-' + family) or not re.fullmatch(r'\d+(?:\.\d+)+', version):
              raise ValueError(f'Unexpected compiler for {build}: {compiler}')
          name = f'JX3DPS-{build}-{version}'
          print(name)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              print(f'name={name}', file=out)
              print(f'compiler={family} {version}', file=out)
      - name: Build desktop
        run: cmake --build build --target JX3DPSDesktop

      - name: Benchmark the Release executable
        shell: python {0}
        env:
          BUILD_ID: ${{ matrix.id }}
          JX3DPS_RELEASE_TAG: ${{ needs.version.outputs.tag }}
          JX3DPS_BUILD_ID: ${{ matrix.id }}
          COMPILER: ${{ steps.package.outputs.compiler }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          exe = Path('build/desktop-workload-Release.txt').read_text().strip()
          subprocess.run([sys.executable, 'tools/release/measure.py', '--desktop', exe,
                          '--build', os.environ['BUILD_ID'], '--compiler', os.environ['COMPILER'],
                          '--runner', os.environ['RUNNER_LABEL'], '--sha', os.environ['GITHUB_SHA'],
                          '--output', 'benchmarks/bench-' + os.environ['BUILD_ID'] + '.json',
                          *(['--train-gcc-build', 'build'] if os.environ['BUILD_ID'].endswith('-gcc') else [])], check=True)
      - uses: actions/upload-artifact@v6
        with:
          name: bench-${{ matrix.id }}
          path: benchmarks/bench-*.json
          if-no-files-found: error

      - name: Package Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath 'build/bin/JX3DPS Desktop.exe')) { throw 'Missing desktop executable' }
          New-Item -ItemType Directory -Path build/bin/data -Force | Out-Null
          Copy-Item -LiteralPath data/jx3box -Destination build/bin/data -Recurse
          Compress-Archive -Path build/bin/* -DestinationPath ${{ steps.package.outputs.name }}.zip
      - name: Package Linux desktop
        if: runner.os == 'Linux'
        run: |
          test -x 'build/bin/JX3DPS Desktop'
          mkdir -p build/bin/data && cp -R data/jx3box build/bin/data/
          tar -C build/bin -czf ${{ steps.package.outputs.name }}.tar.gz .
      - name: Package macOS desktop
        if: runner.os == 'macOS'
        run: |
          app=build/bin/JX3DPSDesktop.app
          test -x "$app/Contents/MacOS/JX3DPSDesktop"
          lipo "$app/Contents/MacOS/JX3DPSDesktop" -verify_arch arm64
          mkdir -p "$app/Contents/Resources/data" && cp -R data/jx3box "$app/Contents/Resources/data/"
          macdeployqt "$app" -dmg
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" ${{ steps.package.outputs.name }}.zip
          mv build/bin/JX3DPSDesktop.dmg ${{ steps.package.outputs.name }}.dmg
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.*
          if-no-files-found: error
          retention-days: 7

  web:
    name: WebAssembly Emscripten
    runs-on: ubuntu-24.04
    env:
      EMSDK_VERSION: 7.0.0
    steps:
      - uses: actions/checkout@v6
      - name: Fetch engine JSON dependency
        run: |
          git -c 'url.https://github.com/.insteadOf=git@github.com:' submodule update --init 3rd/json
      - name: Build static Web workbench
        shell: bash
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --target jx3dps_web
          (cd build-web/out && zip -qr "$GITHUB_WORKSPACE/JX3DPS-web-wasm32-emscripten-$EMSDK_VERSION.zip" .)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Benchmark the packaged Web worker in Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tools/release/measure.py --site build-web/out --build web-wasm32-emscripten --compiler "Emscripten $EMSDK_VERSION" --runner ubuntu-24.04 --sha "$GITHUB_SHA" --output benchmarks/bench-web.json
      - uses: actions/upload-artifact@v6
        with:
          name: JX3DPS-web-wasm32-emscripten-${{ env.EMSDK_VERSION }}
          path: JX3DPS-web-wasm32-emscripten-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: bench-web
          path: benchmarks/bench-web.json
          if-no-files-found: error

  release:
    needs: [version, build, web]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: packages
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install release chart dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          python -m pip install matplotlib
          python tools/release/test_changelog.py
      - name: Compare school timings and summarize changes since the previous release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          python tools/release/changelog.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --tag "$TAG" --benchmarks packages --output packages/release.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: packages/release.md
          files: |
            packages/JX3DPS-windows-x86_64-gcc-*.zip
            packages/JX3DPS-windows-x86_64-msvc-*.zip
            packages/JX3DPS-windows-x86_64-clang-*.zip
            packages/JX3DPS-linux-x86_64-gcc-*.tar.gz
            packages/JX3DPS-macos-arm64-appleclang-*.dmg
            packages/JX3DPS-macos-arm64-appleclang-*.zip
            packages/JX3DPS-web-wasm32-emscripten-*.zip
            packages/performance.png
            packages/performance-comparison-*.png
            packages/performance.json
          fail_on_unmatched_files: true
