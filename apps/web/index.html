<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="theme-color" content="#12382e" />
        <title>JX3DPS · 战斗工作台</title>
        <link rel="icon" href="./icons/8484.png" />
        <link rel="stylesheet" href="./ui/style.css" />
    </head>
    <body>
        <header>
            <div class="brand">
                <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>JX3<span>DPS</span>
            </div>
            <span class="divider"></span><strong>战斗工作台</strong
            ><span class="engine" id="status" role="status">内核加载中</span>
        </header>
        <main>
            <div class="page-title">
                <div>
                    <h1>战斗模拟器</h1>
                    <p>剑网 3 · 技能循环与伤害分析</p>
                </div>
                <button class="secondary" id="historyOpen">运行记录 <span id="historyCount">0</span></button>
            </div>
            <div class="layout">
                <aside>
                    <form id="settings" class="panel">
                        <h2>模拟配置</h2>
                        <fieldset>
                            <legend>心法</legend>
                            <select id="school" aria-label="心法与规则版本">
                            </select>
                        </fieldset>
                        <details id="schoolRules" hidden><summary>已实现的招式与配置</summary>
                            <p id="schoolSkills"></p><div id="schoolChoices"></div>
                        </details>

                        <div class="pair">
                            <label
                                >战斗时长
                                <div class="unit">
                                    <input
                                        required
                                        type="number"
                                        id="seconds"
                                        value="300"
                                        min="1"
                                        max="1800"
                                    /><span>秒</span>
                                </div></label
                            >
                            <label
                                >模拟场数
                                <div class="unit">
                                    <input
                                        required
                                        type="number"
                                        id="iterations"
                                        value="1000"
                                        min="1"
                                        max="100000"
                                    /><span>场</span>
                                </div></label
                            >
                        </div>
                        <label
                            >随机种子<input
                                id="seed"
                                required
                                value="42"
                                pattern="[0-9]{1,20}"
                                inputmode="numeric"
                        /></label>
                        <details>
                            <summary>角色属性</summary>
                            <div class="pair">
                                <label>基础攻击<input type="number" id="attack" data-stat="attack_base" min="0" max="1000000" /></label>
                                <label>心法攻击<input type="number" id="attackClass" data-stat="attack_by_class" min="0" max="1000000" /></label>
                                <label>武器伤害<input type="number" id="weapon" data-stat="weapon" min="0" max="1000000" /></label>
                                <label>会心等级<input type="number" id="crit" data-stat="crit" min="0" max="1000000" /></label>
                                <label>会效等级<input type="number" id="critPower" data-stat="crit_power" min="0" max="1000000" /></label>
                                <label>破防等级<input type="number" id="overcome" data-stat="overcome" min="0" max="1000000" /></label>
                                <label>无双等级<input type="number" id="strain" data-stat="strain" min="0" max="1000000" /></label>
                                <label>加速等级<input type="number" id="haste" data-stat="haste" min="0" max="1000000" /></label>
                            </div>
                        </details>
                        <details>
                            <summary>小药、食品与阵法</summary>
                            <label><input type="checkbox" id="raidFull" />开荒拉满（副本团队增益）</label>
                            <div id="permanentChoices" class="pair"></div>
                        </details>
                        <button id="run" class="run" disabled>
                            <span aria-hidden="true">▶</span> 运行模拟</button
                        ><button type="button" id="cancel" hidden>取消运行</button>
                        <progress id="progress" hidden></progress>
                        <div id="error" role="alert" hidden></div>
                    </form>
                    <section class="panel macro-panel">
                        <div class="panel-heading">
                            <h2>技能宏</h2>
                            <button class="link" id="restore">恢复默认</button>
                        </div>
                        <div class="editor">
                            <div id="gutter" aria-hidden="true"></div>
                            <textarea id="macro" spellcheck="false" wrap="off" aria-label="技能宏"></textarea>
                        </div>
                        <button class="secondary wide" id="debugOpen" disabled>单场调试</button>
                    </section>
                </aside>
                <section class="results">
                    <article class="hero">
                        <div class="hero-top">
                            <h2>模拟结果</h2>
                            <span id="resultMeta">等待首次运行</span>
                        </div>
                        <div class="hero-grid">
                            <div>
                                <div class="metric-label">平均秒伤</div>
                                <div class="number"><strong id="dps">—</strong><span>DPS</span></div>
                            </div>
                            <figure>
                                <canvas id="dist" role="img" aria-label="各秒伤区间场数分布"></canvas>
                                <figcaption>秒伤分布</figcaption>
                            </figure>
                        </div>
                        <div class="metrics">
                            <div><span>最低秒伤</span><b id="low">—</b></div>
                            <div><span>最高秒伤</span><b id="high">—</b></div>
                            <div><span>标准差</span><b id="sd">—</b></div>
                        </div>
                    </article>
                    <section class="panel breakdown">
                        <div class="panel-heading">
                            <h2>技能伤害构成</h2>
                            <span class="quiet" id="skillCount">—</span>
                        </div>
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>技能</th>
                                        <th>伤害占比</th>
                                        <th>命中次数</th>
                                        <th>会心率</th>
                                    </tr>
                                </thead>
                                <tbody id="skills"></tbody>
                            </table>
                            <p class="empty" id="empty">运行模拟后查看技能明细</p>
                        </div>
                        <div class="foot">
                            <span id="total">总伤害 —</span><span id="elapsed">耗时 —</span>
                        </div>
                    </section>
                    <div class="checksum">批次校验值 <code id="checksum">—</code></div>
                </section>
            </div>
        </main>
        <dialog id="history">
            <div class="panel-heading">
                <h2>运行记录</h2>
                <button data-close>关闭</button>
            </div>
            <div id="records"></div>
        </dialog>
        <dialog id="debug">
            <div class="panel-heading">
                <h2>单场调试</h2>
                <button data-close>关闭</button>
            </div>
            <label>断点行号（逗号分隔）<input id="breakpoints" placeholder="例如 2, 4" /></label>
            <pre id="debugSource"></pre>
            <p id="debugState" role="status"></p>
            <div class="actions">
                <button id="debugStart">开始 / 重置</button><button data-step="into">单步进入</button
                ><button data-step="over">单步越过</button><button data-step="continue">继续</button>
            </div>
        </dialog>
        <script type="module" src="./ui/app.js"></script>
    </body>
</html>
